<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Caixa Eletrônico</title>
</head>
<body>
    <h1>Caixa Eletrônico</h1>
    <p>JAVASCRIPT - SIMULAÇÃO DIDÁTICA</p>

    <div class="caixa-conta">
        <p>SALDO DISPONÍVEL</p>
        <span class="saldo">R$ 1.500,00</span>

        <div class="operacoes">
            <p>OPERACOES</p>
            <div class="botoes">
                <button>CONSULTAR SALDO</button>
                <button>SACAR</button>
                <button>DEPOSITAR</button>
                <button>LIMPAR OPERACAO</button>
            </div>

            <p>ULTIMAS MOVIMENTACOES</p>
            <span class="info">Conta Iniciada + R$ 1.500,00</span>
            <p>Digite o valor para sacar.</p>
        </div>
    </div>

    <div class="teclas">
        <p>SACAR</p>
        <span class="valor-saque">R$ 0,00</span>

        <div class="saque-rapido">
            <button>R$ 50</button>
            <button>R$ 100</button>
            <button>R$ 200</button>
        </div>

        <div class="teclado">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
        </div>

        <div class="btn-operacao">
            <button>CANCELAR</button>
            <button>LIMPAR</button>
            <button>CONFIRMAR</button>
        </div>
        <p>Sistema demonstrativo - Nenhum dado bancário real</p>
    </div>
</body>
</html>
