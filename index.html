<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Caixa Eletrônico</title>
</head>
<body>
    <h1>Caixa Eletrônico</h1>
    <p class="descricao">JAVASCRIPT - SIMULAÇÃO DIDÁTICA</p>

    <div class="container">

    <div class="caixa-conta">
        <p class="info-saldo">SALDO DISPONIVEL</p>
        <span class="saldo">R$ 1.500,00</span>

        <div class="operacoes">
            <p class="info-op">OPERACOES</p>
            <div class="botoes">
                <button id="buttons">CONSULTAR SALDO</button>
                <button class="saque">SACAR</button>
                <button class="deposito">DEPOSITAR</button>
                <button id="buttons">LIMPAR OPERACAO</button>
            </div>

            <p class="info-movi">ULTIMAS MOVIMENTACOES</p>
            <span class="info">Conta Iniciada + R$ 1.500,00</span>
            <p class="info-saque">Digite o valor para sacar.</p>
        </div>
    </div>

    <div class="teclas">
        <p class="sacar">SACAR</p>
        <span class="valor-saque">R$ 0,00</span>

        <div class="saque-rapido">
            <button id="btn-valor">R$ 50</button>
            <button id="btn-valor">R$ 100</button>
            <button id="btn-valor">R$ 200</button>
        </div>

        <div class="teclado">
            <button id="btn-num">1</button>
            <button id="btn-num">2</button>
            <button id="btn-num">3</button>
            <button id="btn-num">4</button>
            <button id="btn-num">5</button>
            <button id="btn-num">6</button>
            <button id="btn-num">7</button>
            <button id="btn-num">8</button>
            <button id="btn-num">9</button>
            <button id="btn-num">0</button>
        </div>

        <div class="btn-operacao">
            <button>CANCELAR</button>
            <button>LIMPAR</button>
            <button>CONFIRMAR</button>
        </div>
        <p>Sistema demonstrativo - Nenhum dado bancário real</p>
    </div>
    </div>
</body>
</html>
