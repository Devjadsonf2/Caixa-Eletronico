<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Caixa Eletrônico</title>
</head>

<body>
    <main class="caixa">

        <!-- Cabeçalho -->
        <header class="cabecalho">
            <h1>CAIXA ELETRÔNICO</h1>
            <p>JavaScript - SIMULAÇÃO DIDÁTICA</p>
        </header>

        <!-- Conteúdo principal -->
        <section class="conteudo">

            <!-- PAINEL ESQUERDO -->
            <div class="painel saldo">

                <span class="label">SALDO DISPONÍVEL</span>
                <H2>R$ 1.500,00</H2>
                <small>
                    Jadson Ferreira &nbsp; | &nbsp;
                    Conta demo 001 &nbsp; | &nbsp;
                    2026
                </small>

                <div class="operacoes">

                    <span class="label">OPERAÇÔES</span>
                    <div class="botoes-operacoes">
                        <button class="btn consultar">CONSULTAR SALDO</button>
                        <button class="btn sacar">SACAR</button>
                        <button class="btn depositar">DEPOSITAR</button>
                        <button class="btn limpar">LIMPAR OPERAÇÂO</button>
                    </div>
                </div>

                <!-- Histórico -->
                <div class="historico">
                    <span class="label">ÚLTIMAS MOVIMENTAÇÕES</span>
                    <p>Conta iniciada <span>+ R$ 1.500,00</span></p>
                    <p class="mensagem">Digite o valor para sacar.</p>

                </div>

            </div>

            <!-- PAINEL DIREITO -->
            <div class="painel saque">

                <div class="titulo-saque">
                    <span class="label">SACAR</span>
                    <strong>R$ 0,05</strong>
                </div>

            <!-- Valores rápidos -->
             <div class="valores">

                <button>R$ 50</button>
                <button>R$ 100</button>
                <button>R$ 200</button>

             </div>
             
             <!-- Teclado -->
              <div class="teclado">

                <button>1</button>
                <button>2</button>
                <button>3</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>

                <div></div>

                <button>0</button>

                <div></div>

              </div>

             <!-- Botões inferiores -->
              <div class="acoes">

                <button class="cancelar">CANCELAR</button>
                <button class="limpar-teclado">LIMPAR</button>
                <button class="confirmar">CONFIRMAR</button>

              </div>

              <footer>
                Sistema demonstrativo • nenhum dado bancário real
              </footer>

            </div>

        </section>

    </main>

</body>

</html>
