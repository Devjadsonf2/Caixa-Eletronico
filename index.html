<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Caixa Eletrônico</title>
</head>

<body>
    <main class="caixa">

        <!-- Cabeçalho -->
        <header class="cabecalho">
            <h1>CAIXA ELETRÔNICO</h1>
            <p>JavaScript - SIMULAÇÃO DIDÁTICA</p>
        </header>

        <!-- Conteúdo principal -->
        <section class="conteudo">

            <!-- PAINEL ESQUERDO -->
            <div class="painel saldo">

                <span class="label">SALDO DISPONÍVEL</span>
                <h2 id="saldo"></h2>
                <small>
                    Jadson Ferreira &nbsp; | &nbsp;
                    Conta demo 001 &nbsp; | &nbsp;
                    2026
                </small>

                <div class="operacoes">

                    <span class="label">OPERAÇÔES</span>
                    <div class="botoes-operacoes">
                        <button class="btn consultar" id="btnConsultar">CONSULTAR SALDO</button>
                        <button class="btn sacar" id="btnSacar">SACAR</button>
                        <button class="btn depositar" id="btnDepositar">DEPOSITAR</button>
                        <button class="btn limpar" id="btnLimpar">LIMPAR OPERAÇÂO</button>
                    </div>
                </div>

                <!-- Histórico -->
                <div class="historico">
                    <span class="label">ÚLTIMAS MOVIMENTAÇÕES</span>

                    <ul id="listaHistorico">
                        
                    </ul>

                    <p id="mensagem" class="mensagem">
                        Selecione uma operação.
                    </p>

                </div>

            </div>

            <!-- PAINEL DIREITO -->
            <div class="painel saque">

                <div class="titulo-saque">
                    <span class="label">SACAR</span>
                    <strong id="valorDigitado"></strong>
                </div>

                <!-- Valores rápidos -->
                <div class="valores">

                    <button data-valor="50">R$ 50</button>
                    <button data-valor="100">R$ 100</button>
                    <button data-valor="200">R$ 200</button>

                </div>

                <!-- Teclado -->
                <div class="teclado">

                    <button data-numero="1">1</button>
                    <button data-numero="2">2</button>
                    <button data-numero="3">3</button>

                    <button data-numero="4">4</button>
                    <button data-numero="5">5</button>
                    <button data-numero="6">6</button>

                    <button data-numero="7">7</button>
                    <button data-numero="8">8</button>
                    <button data-numero="9">9</button>

                    <div></div>

                    <button data-numero="0">0</button>

                    <div></div>

                </div>

                <!-- Botões inferiores -->
                <div class="acoes">

                    <button class="cancelar" id="btnCancelar">CANCELAR</button>
                    <button class="limpar-teclado" id="btnLimpar-Teclado">LIMPAR</button>
                    <button class="confirmar" id="btnConfirmar">CONFIRMAR</button>

                </div>

                <footer>
                    Sistema demonstrativo • nenhum dado bancário real
                </footer>

            </div>

        </section>

    </main>

</body>

<script src="script.js"></script>

</html>
